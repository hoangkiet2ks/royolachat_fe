<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Video Call 1-1</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .videos {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    .video-box {
      flex: 1;
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
    }
    video {
      width: 100%;
      height: 300px;
      background: #000;
      border-radius: 8px;
      object-fit: cover;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    button.danger {
      background: #f44336;
    }
    button.secondary {
      background: #2196F3;
    }
    .log {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid #4CAF50;
      padding-left: 10px;
    }
    .log-entry.error {
      border-left-color: #f44336;
      color: #ff6b6b;
    }
    .log-entry.info {
      border-left-color: #2196F3;
      color: #64b5f6;
    }
    h2 {
      margin-top: 0;
    }
    .status {
      padding: 10px;
      background: #333;
      border-radius: 8px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎥 Test Video Call 1-1</h1>
    
    <div class="status">
      <strong>Status:</strong> <span id="status">Idle</span><br>
      <strong>ICE State:</strong> <span id="iceState">-</span><br>
      <strong>Connection State:</strong> <span id="connState">-</span>
    </div>

    <div class="controls">
      <button onclick="startCaller()">🟢 Start as Caller</button>
      <button onclick="startCallee()">🔵 Start as Callee</button>
      <button class="danger" onclick="endCall()">❌ End Call</button>
      <button class="secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
    </div>

    <div class="videos">
      <div class="video-box">
        <h2>Local Video</h2>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="video-box">
        <h2>Remote Video</h2>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <div class="log" id="logContainer"></div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    let socket;
    let pc;
    let localStream;
    let role; // 'caller' or 'callee'
    let partnerId = role === 'caller' ? 2 : 1; // Giả định caller là user 1, callee là user 2

    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      document.getElementById('logContainer').prepend(entry);
      console.log(message);
    }

    function updateStatus(status) {
      document.getElementById('status').textContent = status;
    }

    function clearLogs() {
      document.getElementById('logContainer').innerHTML = '';
    }

    async function getMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
        log('✅ Got local media stream');
        log(`Local tracks: ${localStream.getTracks().map(t => t.kind).join(', ')}`);
        return localStream;
      } catch (err) {
        log(`❌ Error getting media: ${err.message}`, 'error');
        throw err;
      }
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection(ICE_SERVERS);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          log(`📤 Sending ICE candidate to partner`);
          socket.emit('call:ice-candidate', {
            targetUserId: partnerId,
            candidate: e.candidate.toJSON()
          });
        }
      };

      pc.ontrack = (e) => {
        log(`📥 Received remote track: ${e.track.kind}`);
        document.getElementById('remoteVideo').srcObject = e.streams[0];
        log(`Remote stream tracks: ${e.streams[0].getTracks().map(t => t.kind).join(', ')}`);
      };

      pc.oniceconnectionstatechange = () => {
        log(`ICE Connection State: ${pc.iceConnectionState}`);
        document.getElementById('iceState').textContent = pc.iceConnectionState;
      };

      pc.onconnectionstatechange = () => {
        log(`Connection State: ${pc.connectionState}`);
        document.getElementById('connState').textContent = pc.connectionState;
      };

      pc.onsignalingstatechange = () => {
        log(`Signaling State: ${pc.signalingState}`);
      };

      return pc;
    }

    async function startCaller() {
      role = 'caller';
      partnerId = 2;
      updateStatus('Caller - Initiating call');
      log('🟢 Starting as CALLER');

      // Connect socket
      const token = prompt('Enter your access token:');
      socket = io('http://localhost:3000/chat', {
        auth: { token: `Bearer ${token}` }
      });

      socket.on('connect', async () => {
        log('✅ Socket connected');

        // Get media
        await getMedia();

        // Create PC and add tracks
        createPeerConnection();
        localStream.getTracks().forEach(track => {
          log(`Adding local track: ${track.kind}`);
          pc.addTrack(track, localStream);
        });

        // Send call initiate
        socket.emit('call:initiate', {
          targetUserId: partnerId,
          conversationId: 1,
          callType: 'video',
          callerName: 'Test Caller'
        });
        log('📤 Sent call:initiate');

        // Listen for answered
        socket.on('call:answered', async (data) => {
          log(`📥 Received call:answered - accepted: ${data.accepted}`);
          if (!data.accepted) {
            log('❌ Call rejected', 'error');
            return;
          }

          // Create offer
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          log('📤 Created and set local description (offer)');

          socket.emit('call:offer', {
            targetUserId: partnerId,
            offer
          });
          log('📤 Sent call:offer');
        });

        // Listen for answer
        socket.on('call:webrtc-answer', async (data) => {
          log('📥 Received call:webrtc-answer');
          await pc.setRemoteDescription(data.answer);
          log('✅ Set remote description (answer)');
          updateStatus('Caller - Connected');
        });

        // Listen for ICE candidates
        socket.on('call:ice-candidate', async (data) => {
          log('📥 Received ICE candidate');
          await pc.addIceCandidate(data.candidate);
        });

        socket.on('call:unavailable', () => {
          log('❌ Partner unavailable', 'error');
          updateStatus('Partner unavailable');
        });
      });
    }

    async function startCallee() {
      role = 'callee';
      partnerId = 1;
      updateStatus('Callee - Waiting for call');
      log('🔵 Starting as CALLEE');

      // Connect socket
      const token = prompt('Enter your access token:');
      socket = io('http://localhost:3000/chat', {
        auth: { token: `Bearer ${token}` }
      });

      socket.on('connect', () => {
        log('✅ Socket connected');

        // Listen for incoming call
        socket.on('call:incoming', async (data) => {
          log(`📥 Received call:incoming from ${data.callerName}`);
          updateStatus('Callee - Incoming call');

          // Auto accept after 1 second
          setTimeout(async () => {
            log('🟢 Auto-accepting call...');

            // Get media
            await getMedia();

            // Create PC and add tracks
            createPeerConnection();
            localStream.getTracks().forEach(track => {
              log(`Adding local track: ${track.kind}`);
              pc.addTrack(track, localStream);
            });

            // Send accept
            socket.emit('call:answer', {
              callerId: data.callerId,
              accepted: true,
              conversationId: data.conversationId
            });
            log('📤 Sent call:answer (accepted)');
            updateStatus('Callee - Waiting for offer');
          }, 1000);
        });

        // Listen for offer
        socket.on('call:offer', async (data) => {
          log('📥 Received call:offer');
          await pc.setRemoteDescription(data.offer);
          log('✅ Set remote description (offer)');

          // Create answer
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          log('📤 Created and set local description (answer)');

          socket.emit('call:webrtc-answer', {
            callerId: data.callerId,
            answer
          });
          log('📤 Sent call:webrtc-answer');
          updateStatus('Callee - Connected');
        });

        // Listen for ICE candidates
        socket.on('call:ice-candidate', async (data) => {
          log('📥 Received ICE candidate');
          await pc.addIceCandidate(data.candidate);
        });
      });
    }

    function endCall() {
      log('🛑 Ending call');
      
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      if (pc) {
        pc.close();
        pc = null;
      }

      if (socket) {
        socket.emit('call:end', { targetUserId: partnerId });
        socket.disconnect();
        socket = null;
      }

      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      updateStatus('Idle');
      log('✅ Call ended');
    }
  </script>
</body>
</html>
